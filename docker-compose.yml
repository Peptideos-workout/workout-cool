services:
  postgres:
    image: postgres:15
    ports:
      # Default 5433 avoids clashing with another local Postgres on 5432 (e.g. other Docker stacks).
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file: .env

  workout_cool:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Default 3001 avoids clashing with another app on host 3000 (e.g. another frontend container).
      - "${APP_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
volumes:
  pgdata:
